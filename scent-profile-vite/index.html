<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scent Profile — Olfactory Analytics</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❋</text></svg>" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { min-height: 100vh; background: #0f0d09; }
      body { -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2a2318; border-radius: 3px; }
      /* Mobile responsive */
      @media (max-width: 768px) {
        .edit-modal-inner { flex-direction: column !important; height: 95vh !important; width: 100% !important; max-width: 100% !important; border-radius: 12px 12px 0 0 !important; }
        .edit-sidebar { width: 100% !important; max-height: 40vh !important; border-right: none !important; border-bottom: 1px solid #2a2318 !important; }
        .edit-detail { padding: 16px !important; }
        .header-actions { flex-wrap: wrap !important; gap: 4px !important; }
        .tab-bar { overflow-x: auto !important; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-wrap: nowrap !important; }
        .tab-bar::-webkit-scrollbar { display: none; }
        .stat-pills { flex-wrap: wrap !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
